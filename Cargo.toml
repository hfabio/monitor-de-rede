[package]
name = "monitor-rede"
version = "0.6.0"
edition = "2021"
description = "Monitor de latência, perda de pacotes e uso da rede com interface gráfica"
repository = "https://github.com/hfabio/monitor-de-rede"

# Biblioteca (usada pelo executável de desktop e, como .so, pelo APK Android).
[lib]
name = "monitor_rede"
path = "src/lib.rs"

[[bin]]
name = "monitor-rede"
path = "src/main.rs"

[dependencies]
egui_plot = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.37"
sysinfo = { version = "0.40", default-features = false, features = ["network"] }

# Android: NativeActivity + OpenGL ES (glow). O accesskit não funciona com NativeActivity.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"
socket2 = "0.6"

# Ícone na bandeja do sistema (no Linux exigiria GTK; lá o app fecha normalmente).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
