name: Build

# Compila e testa nos três sistemas a cada push/PR, e gera o APK Android.
# Em tags "v*" também publica os executáveis numa Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
          - name: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Testes
        run: cargo test --locked

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/monitor-rede.exe dist/MonitorRede-windows-x64.exe

      # Instalador (Inno Setup): instala em Arquivos de Programas e configura o
      # app para abrir sempre como administrador, sem a pergunta do UAC.
      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DExePath=..\target\release\monitor-rede.exe" installer\MonitorRede.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          mkdir -p dist
          tar -C target/release -czf dist/MonitorRede-linux-x64.tar.gz monitor-rede

      - name: Build (macOS universal .app)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          APP="dist/Monitor de Rede.app"
          mkdir -p "$APP/Contents/MacOS"
          lipo -create -output "$APP/Contents/MacOS/monitor-rede" \
            target/aarch64-apple-darwin/release/monitor-rede \
            target/x86_64-apple-darwin/release/monitor-rede
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Monitor de Rede</string>
            <key>CFBundleDisplayName</key><string>Monitor de Rede</string>
            <key>CFBundleIdentifier</key><string>com.hfabio.monitor-rede</string>
            <key>CFBundleExecutable</key><string>monitor-rede</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep -s - "$APP"
          cd dist && ditto -c -k --keepParent "Monitor de Rede.app" MonitorRede-macos-universal.zip && rm -rf "Monitor de Rede.app"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  android:
    name: android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      # O runner já traz o SDK (ANDROID_HOME, build-tools, platforms), o NDK
      # (ANDROID_NDK_LATEST_HOME) e Java (keytool/apksigner). Sem Gradle: o
      # APK é montado com aapt2 + zipalign + apksigner por android/build-apk.sh.
      - name: Build do APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          echo "SDK: $ANDROID_HOME"
          # Chave fixa opcional (secrets); sem ela, uma chave de depuração gerada aqui.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            unset KEYSTORE_PASS
          fi
          android/build-apk.sh dist/MonitorRede-android-arm64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: dist/*

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
